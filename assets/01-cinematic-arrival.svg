<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="100%" height="100%">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#001433"/>
    </linearGradient>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E62429" stop-opacity="0.8">
        <animate attributeName="stop-opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <filter id="neon">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="halftone" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#sky)"/>
  <rect width="100%" height="100%" fill="url(#halftone)"/>
  
  <!-- Glowing Portal / Spider-Sense -->
  <circle cx="400" cy="125" r="150" fill="url(#portal)"/>
  
  <!-- Animated Rain (Barsat Vibe) -->
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5">
    <line x1="100" y1="-50" x2="80" y2="300"><animateTransform attributeName="transform" type="translate" values="0,-300; 0,300" dur="0.8s" repeatCount="indefinite"/></line>
    <line x1="300" y1="-50" x2="280" y2="300"><animateTransform attributeName="transform" type="translate" values="0,-300; 0,300" dur="0.6s" repeatCount="indefinite"/></line>
    <line x1="500" y1="-50" x2="480" y2="300"><animateTransform attributeName="transform" type="translate" values="0,-300; 0,300" dur="0.9s" repeatCount="indefinite"/></line>
    <line x1="700" y1="-50" x2="680" y2="300"><animateTransform attributeName="transform" type="translate" values="0,-300; 0,300" dur="0.7s" repeatCount="indefinite"/></line>
    <line x1="200" y1="-100" x2="180" y2="300"><animateTransform attributeName="transform" type="translate" values="0,-300; 0,300" dur="0.5s" repeatCount="indefinite"/></line>
    <line x1="600" y1="-100" x2="580" y2="300"><animateTransform attributeName="transform" type="translate" values="0,-300; 0,300" dur="0.85s" repeatCount="indefinite"/></line>
  </g>

  <!-- City Skyline Silhouette -->
  <path d="M0,250 L0,180 L40,180 L40,120 L90,120 L90,200 L140,200 L140,90 L200,90 L200,160 L250,160 L250,110 L300,110 L300,190 L360,190 L360,70 L420,70 L420,150 L480,150 L480,100 L540,100 L540,210 L600,210 L600,130 L650,130 L650,180 L720,180 L720,100 L780,100 L780,250 Z" fill="#0B0B0B" stroke="#0056D2" stroke-width="2" filter="url(#neon)"/>
  
  <!-- Swinging Web -->
  <path d="M 400,-10 Q 450,100 520,180" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 5">
     <animate attributeName="stroke-dashoffset" from="10" to="0" dur="0.5s" repeatCount="indefinite"/>
  </path>
  
  <!-- Spider-Man Abstract Geometric Emblem -->
  <g transform="translate(520,180)">
    <circle cx="0" cy="0" r="10" fill="#E62429"/>
    <path d="M-8,-2 L8,-2 L4,6 L-4,6 Z" fill="#0B0B0B"/>
    <circle cx="-3" cy="2" r="2" fill="#ffffff"/>
    <circle cx="3" cy="2" r="2" fill="#ffffff"/>
  </g>
</svg>
