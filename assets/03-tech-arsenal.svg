<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <radialGradient id="holo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0056D2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0B0B0B" stop-opacity="1"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#holo)"/>
  
  <g fill="none" stroke="#0056D2" stroke-width="1" opacity="0.5">
    <circle cx="400" cy="100" r="80"/>
    <circle cx="400" cy="100" r="70" stroke-dasharray="5 5">
      <animateTransform attributeName="transform" type="rotate" from="0 400 100" to="360 400 100" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g font-family="monospace" font-size="14" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
    <text x="250" y="105">REACT.JS</text>
    <text x="550" y="105">NODE.JS</text>
    <text x="400" y="55">MONGODB</text>
    <text x="400" y="155">EXPRESS</text>
    <text x="120" y="105">C++ / JS</text>
    <text x="680" y="105">TAILWIND</text>
  </g>

  <!-- Glitch Center Text -->
  <text x="400" y="105" font-family="Impact, sans-serif" font-size="20" fill="#E62429" text-anchor="middle" filter="url(#glow)">
    MERN CORE
  </text>
</svg>
