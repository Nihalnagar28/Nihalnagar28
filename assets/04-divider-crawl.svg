<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 60" width="100%" height="100%">
  <path d="M 0,30 L 800,30" fill="none" stroke="#333" stroke-width="2"/>
  <circle cx="400" cy="30" r="10" fill="none" stroke="#E62429" stroke-width="3">
    <animate attributeName="r" values="10; 40; 10" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1; 0; 1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="30" r="5" fill="#FFFFFF"/>
</svg>
